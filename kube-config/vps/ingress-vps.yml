apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress-vps
spec:
  ingressClassName: traefik
  rules:
    - host: conv.vps
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: conv-app-clusterip
                port:
                  number: 80
    - host: agrigoryev13.fvds.ru
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: conv-app-clusterip
                port:
                  number: 80
